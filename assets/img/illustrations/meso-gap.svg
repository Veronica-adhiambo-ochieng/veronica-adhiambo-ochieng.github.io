<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d">
  <title id="t">The gap</title>
  <desc id="d">A worried pregnant mother under a small rain cloud. Beside her, a nurse checks only the baby bump with a stethoscope. A broken dotted line shows they are not connected about how the mother feels.</desc>
  <defs><clipPath id="c1"><rect width="320" height="200" rx="16"/></clipPath></defs>
  <g clip-path="url(#c1)">
  <rect width="320" height="200" fill="#F6ECF1"/>

  <!-- mother (left), worried -->
  <path d="M40 60 C38 34 58 22 78 24 C100 24 116 40 112 64 C118 80 110 98 116 112 L44 112 C48 96 36 80 40 60 Z" fill="#2E1F2B"/>
  <ellipse cx="78" cy="66" rx="22" ry="25" fill="#8A5A44"/>
  <path d="M57 58 C58 38 70 32 78 35 C88 32 100 38 99 58 C93 46 86 42 78 43 C70 42 62 46 57 58 Z" fill="#2E1F2B"/>
  <g fill="none" stroke="#2E1F2B" stroke-width="2.2" stroke-linecap="round">
    <path d="M65 56 l9 -3"/><path d="M91 56 l-9 -3"/>
    <path d="M66 67 q4 3 8 0"/><path d="M82 67 q4 3 8 0"/>
  </g>
  <path d="M71 80 q7 -4 14 0" fill="none" stroke="#5C2C4C" stroke-width="2" stroke-linecap="round"/>
  <path d="M93 72 q2 5 0 8 q-3 -3 0 -8 z" fill="#9FC3E0"/>
  <path d="M34 200 C34 130 54 104 78 104 C102 104 122 130 122 200 Z" fill="#7A3E65"/>
  <ellipse cx="96" cy="160" rx="24" ry="22" fill="#8C4A75"/>

  <!-- little rain cloud over her -->
  <g fill="#B9A6B4">
    <circle cx="62" cy="16" r="9"/><circle cx="76" cy="12" r="11"/><circle cx="90" cy="17" r="8"/>
    <rect x="58" y="15" width="36" height="10" rx="5"/>
  </g>
  <g stroke="#9FC3E0" stroke-width="2" stroke-linecap="round"><path d="M66 30 l-2 5"/><path d="M78 30 l-2 5"/><path d="M90 30 l-2 5"/></g>

  <!-- broken connection -->
  <path d="M132 120 H200" stroke="#7A3E65" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
  <g stroke="#D4A23C" stroke-width="3" stroke-linecap="round"><path d="M160 110 l8 20"/><path d="M168 110 l-8 20"/></g>

  <!-- nurse (right), focused on the bump -->
  <rect x="228" y="27" width="40" height="13" rx="5" fill="#FFF9F5" stroke="#E9D6E0"/>
  <path d="M244 33.5 h8 M248 29.5 v8" stroke="#D4A23C" stroke-width="2.2"/>
  <ellipse cx="248" cy="58" rx="20" ry="23" fill="#6E4230"/>
  <path d="M228 52 C230 34 266 34 268 52 C262 42 234 42 228 52 Z" fill="#2E1F2B"/>
  <g fill="#2E1F2B"><circle cx="241" cy="58" r="2.4"/><circle cx="255" cy="58" r="2.4"/></g>
  <path d="M242 69 h12" stroke="#5C2C4C" stroke-width="2" stroke-linecap="round"/>
  <rect x="241" y="74" width="14" height="26" rx="5" fill="#6E4230"/>
  <path d="M206 200 C206 128 226 96 248 96 C270 96 290 128 290 200 Z" fill="#FFFFFF" stroke="#E9D6E0" stroke-width="2"/>
  <!-- stethoscope reaching toward the bump -->
  <path d="M238 100 C230 130 214 140 196 150" fill="none" stroke="#5C2C4C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="192" cy="152" r="6" fill="#D4A23C"/>
  <path d="M258 100 C262 118 258 128 250 134" fill="none" stroke="#5C2C4C" stroke-width="3" stroke-linecap="round"/>
  <!-- clipboard: bump and baby only -->
  <rect x="254" y="138" width="34" height="42" rx="4" fill="#F2D9A0"/>
  <g stroke="#7A3E65" stroke-width="2" stroke-linecap="round"><path d="M260 150 h22"/><path d="M260 160 h22"/><path d="M260 170 h14"/></g>
  </g>
</svg>
